name: Play video
# Records the screen video for Google Play's foreground service declaration (Media playback) on a phone emulator, with
# nothing personal on screen: Play in the app, reading carries on at the home screen with the media notification,
# pause and play from the notification, then back to the app. It uses the release build, signed here with the debug
# key, so it shows the app's real name. Download it from the run's artifacts to play/fgs-media-playback.mp4.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without the upload key's secrets the release build is unsigned; the test build creates the debug key.
      - run: ./gradlew :app:assembleRelease :releasetest:assembleStaging --console=plain
      - name: Sign the release build with the debug key
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey \
            --key-pass pass:android --out app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 5X
          cores: 4
          ram-size: 6144M
          disk-size: 4096M
          # Animations on, so the video looks like a phone in use.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0930
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb install -r app-release.apk
            adb install -r -t releasetest/build/outputs/apk/staging/releasetest-staging.apk
            adb shell am instrument -w -r -e class com.orexii.aimarkdownreader.releasetest.PlayVideoTest -e video true -e app com.orexii.aimarkdownreader com.orexii.aimarkdownreader.releasetest/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb logcat -d -s PlayVideoTest TestRunner AndroidRuntime > logcat-video.txt
            adb pull /data/local/tmp/fgs-media-playback.mp4 || true
            adb pull /data/local/tmp/releasetest-failure.png || true
            grep -q "^OK (1 test)" instrument.txt
            test -s fgs-media-playback.mp4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-video
          path: |
            fgs-media-playback.mp4
            releasetest-failure.png
            instrument.txt
            logcat-video.txt
